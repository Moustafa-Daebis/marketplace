<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Items</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7ff, #eef7f4);
            color: #1f2937;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 20px;
            padding-top: 100px; /* ensure content sits below fixed navbar */
        }
        .nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #111827;
            color: white;
            padding: 16px 24px;
            border-radius: 0;
            margin: 0;
            box-shadow: 0 4px 14px rgba(17,24,39,0.12);
            z-index: 1000;
        }
        .brand {
            font-size: 1.5rem;
            font-weight: bold;
        }
        .menu-toggle { display: none; background: transparent; border: none; color: white; font-size: 1.25rem; cursor: pointer; }
        .nav-links {
            display: flex;
            gap: 16px;
            align-items: center;
        }
        .nav-links a {
            color: white;
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 8px;
        }
        .nav-links a:hover {
            background: rgba(255,255,255,0.1);
        }
        .user-pill {
            color: white;
            font-weight: 600;
            padding: 8px 10px;
            border-radius: 999px;
            background: rgba(255,255,255,0.08);
        }
        .logout-btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            border-radius: 999px;
            padding: 8px 12px;
            font-weight: 600;
            cursor: pointer;
        }
        @media (max-width: 700px) {
            .menu-toggle { display: block; }
            .nav { padding: 12px 16px; }
            .nav-links { display: none; width: 100%; }
            .nav.open .nav-links { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
            .nav.open .nav-links a { display: block; padding: 10px 14px; }
        }
        .hero {
            display: grid;
            grid-template-columns: 1.3fr 1fr;
            gap: 30px;
            align-items: center;
        }
        .hero-card {
            background: white;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(17, 24, 39, 0.08);
            padding: 30px;
        }
        .hero-card h1 {
            font-size: 2.5rem;
            margin-bottom: 16px;
        }
        .hero-card p {
            font-size: 1.05rem;
            line-height: 1.7;
            color: #4b5563;
            margin-bottom: 24px;
        }
        .btn-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-block;
            text-decoration: none;
            padding: 12px 18px;
            border-radius: 10px;
            font-weight: 600;
            border: none;
            cursor: pointer;
        }
        .btn-primary {
            background: #2563eb;
            color: white;
        }
        .btn-secondary {
            background: #e5e7eb;
            color: #111827;
        }
        .auth-card {
            background: white;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(17, 24, 39, 0.08);
            padding: 24px;
        }
        .tab-buttons {
            display: flex;
            margin-bottom: 20px;
            border-radius: 10px;
            background: #f3f4f6;
            overflow: hidden;
        }
        .tab-buttons button {
            flex: 1;
            border: none;
            background: transparent;
            padding: 12px 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .tab-buttons .active {
            background: #111827;
            color: white;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 1rem;
        }
        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #4b5563;
        }
        .checkbox-row input {
            width: auto;
        }
        .features {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 40px;
        }
        .feature {
            background: white;
            border-radius: 16px;
            padding: 22px;
            box-shadow: 0 8px 20px rgba(17, 24, 39, 0.06);
        }
        .feature h3 {
            margin-top: 0;
        }
        @media (max-width: 820px) {
            .hero, .features {
                grid-template-columns: 1fr;
            }
            .nav {
                flex-direction: column;
                gap: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <nav class="nav" id="mainNav">
            <div class="brand">Marketplace</div>
            <button class="menu-toggle" aria-label="Toggle menu" onclick="document.getElementById('mainNav').classList.toggle('open')">☰</button>
            <div class="nav-links">
                <a th:href="@{/}">Home</a>
                <a th:href="@{/items}">Items</a>
                <a th:href="@{/add-item}">Sell</a>
                <th:block th:if="${loggedIn}">
                    <span class="user-pill" th:text="${currentUserName}">User</span>
                    <form th:action="@{/logout}" method="post" style="display:inline; margin:0;">
                        <button class="logout-btn" type="submit">Logout</button>
                    </form>
                </th:block>
                <a th:unless="${loggedIn}" th:href="@{/login}">Login</a>
            </div>
        </nav>

        <div id="items-container" class="grid"></div>
    </div>

    <script>
        async function loadItems() {
            const container = document.getElementById('items-container');

            try {
                const response = await fetch('/api/items');
                const result = await response.json();
                const items = result && Array.isArray(result.data) ? result.data : [];

                if (!items.length) {
                    container.innerHTML = '<div class="empty-state">No items available.</div>';
                    return;
                }

                container.innerHTML = items.map(item => `
                    <div class="card">
                        <div class="badge">Item</div>
                        <h3>${item.name || 'Untitled item'}</h3>
                        <p>${item.description || 'No description provided.'}</p>
                        <div class="meta">Seller ID: ${item.sellerId || 'N/A'}</div>
                        <div class="meta">Item ID: ${item.id || 'N/A'}</div>
                        <a class="btn" href="#">View details</a>
                    </div>
                `).join('');
            } catch (error) {
                container.innerHTML = '<div class="empty-state">Failed to load items.</div>';
                console.error('Error loading items:', error);
            }
        }

        loadItems();
    </script>
</body>
</html>
