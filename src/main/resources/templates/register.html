<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f0fdf4, #eff6ff);
            color: #111827;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 20px;
            padding-top: 100px; /* ensure content sits below fixed navbar */
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: calc(100vh - 100px);
        }
        .nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #111827;
            color: white;
            padding: 16px 24px;
            border-radius: 0;
            margin: 0;
            box-shadow: 0 4px 14px rgba(17,24,39,0.12);
            z-index: 1000;
        }
        .brand { font-size: 1.5rem; font-weight: bold; }
        .menu-toggle { display: none; background: transparent; border: none; color: white; font-size: 1.25rem; cursor: pointer; }
        .nav-links { display: flex; gap: 16px; align-items: center; }
        .nav-links a { color: white; text-decoration: none; padding: 8px 12px; border-radius: 8px; }
        .nav-links a:hover { background: rgba(255,255,255,0.1); }
        .user-pill {
            color: white;
            font-weight: 600;
            padding: 8px 10px;
            border-radius: 999px;
            background: rgba(255,255,255,0.08);
        }
        .logout-btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            border-radius: 999px;
            padding: 8px 12px;
            font-weight: 600;
            cursor: pointer;
        }
        @media (max-width: 700px) {
            .menu-toggle { display: block; }
            .nav { padding: 12px 16px; }
            .nav-links { display: none; width: 100%; }
            .nav.open .nav-links { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
            .nav.open .nav-links a { display: block; padding: 10px 14px; }
        }
        .auth-box {
            background: white;
            border-radius: 18px;
            box-shadow: 0 12px 35px rgba(17, 24, 39, 0.08);
            width: 100%;
            max-width: 460px;
            padding: 32px 28px;
        }
        h1 { margin-top: 0; margin-bottom: 8px; text-align: center; }
        p { text-align: center; color: #6b7280; margin-bottom: 24px; }
        form { display: flex; flex-direction: column; gap: 16px; }
        .row { display: flex; gap: 12px; }
        input { width: 100%; padding: 12px 14px; border: 1px solid #d1d5db; border-radius: 10px; font-size: 1rem; }
        .btn { border: none; border-radius: 10px; padding: 12px 16px; font-size: 1rem; font-weight: 700; background: #16a34a; color: white; cursor: pointer; }
        .link-row { text-align: center; margin-top: 18px; color: #4b5563; }
        .link-row a { color: #2563eb; text-decoration: none; font-weight: 600; }
        @media (max-width: 520px) { .row { flex-direction: column; } }
    </style>
</head>
<body>
    <nav class="nav" id="mainNav">
        <div class="brand">Marketplace</div>
        <button class="menu-toggle" aria-label="Toggle menu" onclick="document.getElementById('mainNav').classList.toggle('open')">☰</button>
        <div class="nav-links">
            <a th:href="@{/}">Home</a>
            <a th:href="@{/items}">Items</a>
            <a th:href="@{/add-item}">Sell</a>
            <th:block th:if="${loggedIn}">
                <span class="user-pill" th:text="${currentUserName}">User</span>
                <form th:action="@{/logout}" method="post" style="display:inline; margin:0;">
                    <button class="logout-btn" type="submit">Logout</button>
                </form>
            </th:block>
            <a th:unless="${loggedIn}" th:href="@{/login}">Login</a>
        </div>
    </nav>

    <div class="container">
        <div class="auth-box">
            <h1>Register</h1>
            <p>Create your Marketplace account</p>

            <form id="registerForm">
                <div class="row">
                    <input id="firstName" name="firstName" type="text" placeholder="First name" required />
                    <input id="lastName" name="lastName" type="text" placeholder="Last name" required />
                </div>
                <div class="row">
                    <input id="email" name="email" type="email" placeholder="Email address" required />
                </div>
                <div class="row">
                    <input id="password" name="password" type="password" placeholder="Password" required minlength="8" />
                </div>
                <div class="row">
                    <input id="confirmPassword" name="confirmPassword" type="password" placeholder="Confirm password" required minlength="8" />
                </div>
                <div class="row">
                    <input id="phoneNumber" name="phoneNumber" type="text" placeholder="Phone number (optional)" />
                </div>
                <button class="btn" type="submit">Create Account</button>
            </form>

            <div id="message" style="margin-top:12px; text-align:center; color:#dc2626;"></div>

            <script>
                (function() {
                    const form = document.getElementById('registerForm');
                    const msg = document.getElementById('message');

                    form.addEventListener('submit', async (e) => {
                        e.preventDefault();
                        msg.textContent = '';

                        const firstName = document.getElementById('firstName').value.trim();
                        const lastName = document.getElementById('lastName').value.trim();
                        const email = document.getElementById('email').value.trim();
                        const password = document.getElementById('password').value;
                        const confirmPassword = document.getElementById('confirmPassword').value;
                        const phoneNumber = document.getElementById('phoneNumber').value.trim();

                        if (password !== confirmPassword) {
                            msg.style.color = '#dc2626';
                            msg.textContent = 'Passwords do not match.';
                            return;
                        }

                        const body = {
                            firstName, lastName, email, password
                        };
                        if (phoneNumber) body.phoneNumber = phoneNumber;

                        try {
                            const res = await fetch('/api/auth/register', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(body)
                            });

                            if (res.status === 201) {
                                msg.style.color = '#16a34a';
                                msg.textContent = 'Registration successful — redirecting to login...';
                                setTimeout(() => window.location.href = '/login', 1300);
                                return;
                            }

                            const data = await res.json().catch(() => null);
                            const errMsg = data && (data.message || data.error || JSON.stringify(data)) || ('Registration failed (status ' + res.status + ')');
                            msg.style.color = '#dc2626';
                            msg.textContent = errMsg;
                        } catch (err) {
                            msg.style.color = '#dc2626';
                            msg.textContent = 'Network error. Please try again.';
                        }
                    });
                })();
            </script>

            <div class="link-row">
                <span>Already have an account?</span>
                <a href="/login">Login</a>
            </div>
        </div>
    </div>
</body>
</html>
