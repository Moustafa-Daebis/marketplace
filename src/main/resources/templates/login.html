<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <title>Login</title>
    <style>
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 20px;
            padding-top: 100px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: calc(100vh - 100px);
        }

        .auth-box {
            background: white;
            border-radius: 18px;
            box-shadow: 0 12px 35px rgba(17, 24, 39, 0.08);
            width: 100%;
            max-width: 420px;
            padding: 32px 28px;
        }
        h1 { margin-top: 0; margin-bottom: 8px; text-align: center; }
        p { text-align: center; color: #6b7280; margin-bottom: 24px; }
        form { display: flex; flex-direction: column; gap: 16px; }
        input { width: 100%; padding: 12px 14px; border: 1px solid #d1d5db; border-radius: 10px; font-size: 1rem; }
        .btn { border: none; border-radius: 10px; padding: 12px 16px; font-size: 1rem; font-weight: 700; background: #2563eb; color: white; cursor: pointer; }
        .row{ display: flex; gap: 12px; }
        .link-row { text-align: center; margin-top: 18px; color: #4b5563; }
        .link-row a { color: #2563eb; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="container">
        <div class="auth-box">
            <h1>Login</h1>
            <p>Welcome back to Marketplace</p>

            <div th:if="${param.error != null}" style="margin-bottom: 12px; color: #b91c1c; text-align: center; font-weight: 600;">
                Invalid email or password.
            </div>

            <form th:action="@{/login}" method="post">
                <div class="row">
                    <input type="email" name="username" placeholder="Email address" required />
                </div>
                <div class="row">
                    <input type="password" name="password" placeholder="Password" required />
                </div>

                <button class="btn" type="submit">Sign In</button>
            </form>

            <div class="link-row">
                <span>Don’t have an account?</span>
                <a th:href="@{/register}">Register</a>
            </div>
        </div>
    </div>
</body>
</html>
