<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #f0fdf4);
            color: #111827;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 20px;
            padding-top: 100px;
        }
        .nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #111827;
            color: white;
            padding: 16px 24px;
            box-shadow: 0 4px 14px rgba(17,24,39,0.12);
            z-index: 1000;
        }
        .brand { font-size: 1.5rem; font-weight: bold; }
        .menu-toggle { display: none; background: transparent; border: none; color: white; font-size: 1.25rem; cursor: pointer; }
        .nav-links { display: flex; gap: 16px; align-items: center; }
        .nav-links a {
            color: white;
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 8px;
        }
        .nav-links a:hover { background: rgba(255,255,255,0.1); }
        .user-pill {
            color: white;
            font-weight: 600;
            padding: 8px 10px;
            border-radius: 999px;
            background: rgba(255,255,255,0.08);
        }
        .logout-btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            border-radius: 999px;
            padding: 8px 12px;
            font-weight: 600;
            cursor: pointer;
        }
        @media (max-width: 700px) {
            .menu-toggle { display: block; }
            .nav { padding: 12px 16px; }
            .nav-links { display: none; width: 100%; }
            .nav.open .nav-links { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
            .nav.open .nav-links a { display: block; padding: 10px 14px; }
        }
        .profile-card {
            background: white;
            border-radius: 22px;
            box-shadow: 0 12px 30px rgba(17, 24, 39, 0.08);
            padding: 30px;
        }
        .profile-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }
        .avatar {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
        }
        h1 { margin: 0; font-size: 2rem; }
        .subtitle {
            margin: 6px 0 0;
            color: #6b7280;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(3, minmax(180px, 1fr));
            gap: 18px;
            margin-bottom: 26px;
        }
        .stat-box {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 18px;
        }
        .stat-label {
            display: block;
            color: #6b7280;
            font-size: 0.88rem;
            margin-bottom: 8px;
        }
        .stat-value {
            font-size: 1.1rem;
            font-weight: 700;
        }
        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(220px, 1fr));
            gap: 18px;
        }
        .info-box {
            background: #f8fafc;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 18px;
        }
        .info-label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.8rem;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .actions {
            margin-top: 24px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-block;
            text-decoration: none;
            padding: 12px 18px;
            border-radius: 10px;
            font-weight: 700;
            border: none;
            cursor: pointer;
        }
        .btn-primary { background: #2563eb; color: white; }
        .btn-secondary { background: #e5e7eb; color: #111827; }
        @media (max-width: 760px) {
            .stats, .info-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <nav class="nav" id="mainNav">
        <div class="brand">Marketplace</div>
        <button class="menu-toggle" aria-label="Toggle menu" onclick="document.getElementById('mainNav').classList.toggle('open')">☰</button>
        <div class="nav-links">
            <a th:href="@{/}">Home</a>
            <a th:href="@{/items}">Items</a>
            <a th:href="@{/add-item}">Sell</a>
            <th:block th:if="${loggedIn}">
                <span class="user-pill" th:text="${currentUserName} ?: 'User'">User</span>
                <form th:action="@{/logout}" method="post" style="display:inline; margin:0;">
                    <button class="logout-btn" type="submit">Logout</button>
                </form>
            </th:block>
            <a th:unless="${loggedIn}" th:href="@{/login}">Login</a>
        </div>
    </nav>

    <div class="container">
        <div class="profile-card">
            <div th:if="${loggedIn}">
                <div class="profile-header">
                    <div class="avatar" th:text="${#strings.substring(user.firstName, 0, 1)} ?: 'U'">U</div>
                    <div>
                        <h1>My Profile</h1>
                        <p class="subtitle">Welcome back, <span th:text="${user.firstName} ?: 'User'">User</span></p>
                    </div>
                </div>

                <div class="stats">
                    <div class="stat-box">
                        <span class="stat-label">Listings</span>
                        <span class="stat-value">12</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-label">Saved</span>
                        <span class="stat-value">8</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-label">Orders</span>
                        <span class="stat-value">3</span>
                    </div>
                </div>

                <div class="info-grid">
                    <div class="info-box">
                        <span class="info-label">Full name</span>
                        <strong th:text="${user != null and user.firstName != null and user.lastName != null ? user.firstName + ' ' + user.lastName : 'User'}">
                            User
                        </strong>
                    </div>
                    <div class="info-box">
                        <span class="info-label">Email</span>
                        <strong th:text="${user.email} ?: 'user@example.com'">user@example.com</strong>
                    </div>
                    <div class="info-box">
                        <span class="info-label">Phone</span>
                        <strong th:text="${user.phoneNumber} ?: '+1 (555) 123-4567'">+1 (555) 123-4567</strong>
                    </div>
                    <div class="info-box">
                        <span class="info-label">Member since</span>
                        <strong>Jan 2025</strong>
                    </div>
                </div>

                <div class="actions">
                    <a class="btn btn-primary" th:href="@{/add-item}">Sell an item</a>
                    <a class="btn btn-secondary" th:href="@{/items}">Browse items</a>
                </div>
            </div>

            <div th:unless="${loggedIn}" style="text-align:center; padding: 30px 0;">
                <h1>Profile</h1>
                <p class="subtitle">Please log in to view your account details.</p>
                <div class="actions" style="justify-content:center;">
                    <a class="btn btn-primary" th:href="@{/login}">Login</a>
                    <a class="btn btn-secondary" th:href="@{/register}">Register</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
