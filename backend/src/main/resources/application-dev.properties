# Development profile
spring.datasource.url=${DEV_DATABASE_URL:jdbc:h2:mem:marketplace;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DEV_DATABASE_USERNAME:sa}
spring.datasource.password=${DEV_DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

# Do not run schema scripts in dev; Hibernate creates the schema automatically.
spring.sql.init.mode=never
spring.sql.init.platform=h2
spring.sql.init.encoding=UTF-8