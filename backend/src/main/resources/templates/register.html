<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f0fdf4, #eff6ff);
            color: #111827;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .auth-box {
            background: white;
            border-radius: 18px;
            box-shadow: 0 12px 35px rgba(17, 24, 39, 0.08);
            width: 100%;
            max-width: 460px;
            padding: 32px 28px;
        }
        h1 {
            margin-top: 0;
            margin-bottom: 8px;
            text-align: center;
        }
        p {
            text-align: center;
            color: #6b7280;
            margin-bottom: 24px;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .row {
            display: flex;
            gap: 12px;
        }
        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 1rem;
        }
        .btn {
            border: none;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 1rem;
            font-weight: 700;
            background: #16a34a;
            color: white;
            cursor: pointer;
        }
        .link-row {
            text-align: center;
            margin-top: 18px;
            color: #4b5563;
        }
        .link-row a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }
        @media (max-width: 520px) {
            .row {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="auth-box">
        <h1>Register</h1>
        <p>Create your Marketplace account</p>

        <form>
            <div class="row">
                <input type="text" placeholder="First name" />
                <input type="text" placeholder="Last name" />
            </div>
            <div class="row">
                <input  type="email" placeholder="Email address" />
            </div>
            <div class="row">
                <input  type="password" placeholder="Password" />
            </div>
            <div class="row">
                <input  type="password" placeholder="Confirm password" />
            </div>
            <button class="btn" type="submit">Create Account</button>
        </form>

        <div class="link-row">
            <span>Already have an account?</span>
            <a href="/login">Login</a>
        </div>
    </div>
</body>
</html>
