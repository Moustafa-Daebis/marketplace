<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <title th:text="${item.name} + ' | Item Details'">Item Details</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7ff, #eef7f4);
            color: #1f2937;
        }
        .nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #111827;
            color: white;
            padding: 16px 24px;
            border-radius: 0;
            margin: 0;
            box-shadow: 0 4px 14px rgba(17,24,39,0.12);
            z-index: 1000;
        }
        .brand { font-size: 1.5rem; font-weight: bold; }
        .menu-toggle { display: none; background: transparent; border: none; color: white; font-size: 1.25rem; cursor: pointer; }
        .nav-links { display: flex; gap: 16px; align-items: center; }
        .nav-links a { color: white; text-decoration: none; padding: 8px 12px; border-radius: 8px; }
        .nav-links a:hover { background: rgba(255,255,255,0.1); }
        .user-pill {
            color: white;
            font-weight: 600;
            padding: 8px 10px;
            border-radius: 999px;
            background: rgba(255,255,255,0.08);
        }
        .logout-btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            border-radius: 999px;
            padding: 8px 12px;
            font-weight: 600;
            cursor: pointer;
        }

        @media (max-width: 700px) {
            .menu-toggle { display: block; }
            .nav { padding: 12px 16px; }
            .nav-links { display: none; width: 100%; }
            .nav.open .nav-links { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
            .nav.open .nav-links a { display: block; padding: 10px 14px; }
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
            padding-top: 100px;
        }
        .card {
            background: white;
            border-radius: 18px;
            padding: 32px;
            box-shadow: 0 10px 30px rgba(17, 24, 39, 0.08);
        }
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }
        h1 {
            margin-top: 0;
            font-size: 2rem;
        }
        .price {
            font-size: 1.75rem;
            color: #059669;
            font-weight: bold;
            margin: 20px 0;
        }
        .meta {
            color: #4b5563;
            line-height: 1.7;
        }
        .label {
            font-weight: 700;
            color: #111827;
        }
        .actions {
            margin-top: 24px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .btn {
            border: none;
            border-radius: 10px;
            padding: 12px 18px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        .btn-primary {
            background: #2563eb;
            color: white;
        }
        .btn-secondary {
            background: #e5e7eb;
            color: #111827;
        }
    </style>
</head>
<body>
    <nav class="nav" id="mainNav">
        <div class="brand">Marketplace</div>
        <button class="menu-toggle" aria-label="Toggle menu" onclick="document.getElementById('mainNav').classList.toggle('open')">☰</button>
        <div class="nav-links">
            <a th:href="@{/}">Home</a>
            <a th:href="@{/items}">Items</a>
            <a th:href="@{/add-item}">Sell</a>
            <a th:href="@{/cart}">Cart</a>

            <div class="profile-menu-container">
                <button class="profile-button" type="button" aria-label="Profile menu">
                    <span class="icon">👤</span>
                    <span th:text="${loggedIn ? user.firstName : 'Profile'}">Profile</span>
                </button>
                <div class="profile-menu" role="menu">
                    <a th:href="@{/profile}" class="placeholder" role="menuitem">My Profile</a>
                    <a href="#" class="placeholder" role="menuitem">Saved Items</a>
                    <a href="#" class="placeholder" role="menuitem">Orders</a>
                    <a href="#" class="placeholder" role="menuitem">Settings</a>

                    <div class="divider"></div>
                    <th:block th:if="${loggedIn}">
                        <form th:action="@{/logout}" method="post" style="margin:0;">
                            <button class="logout-btn" type="submit">Logout</button>
                        </form>
                    </th:block>
                    <th:block th:unless="${loggedIn}">
                        <a th:href="@{/login}" class="logout-btn" style="display:block; text-decoration:none; text-align:left;">Login</a>
                    </th:block>
                </div>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <a class="back-link" th:href="@{/items}">← Back to items</a>

            <h1 th:text="${item.name}">Item name</h1>

            <div class="price">
                <span th:text="${item.price}">0.00</span>
            </div>

            <div class="meta">
                <p>
                    <span class="label">Description:</span>
                    <span th:text="${item.description}">Item description</span>
                </p>

                <p>
                    <span class="label">Seller ID:</span>
                    <span th:text="${item.sellerId}">seller-id</span>
                </p>
            </div>

            <div class="actions">
                <button id="add-to-cart-btn" class="btn btn-primary" type="button">Add to cart</button>
                <a class="btn btn-secondary" th:href="@{/items}">Continue shopping</a>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        const cartId = /*[[${cartId}]]*/ null;
        const itemId = /*[[${item.id}]]*/ null;

        document.getElementById('add-to-cart-btn')?.addEventListener('click', async () => {
            if (!cartId) {
                alert('Cart not found. Please create or access your cart first.');
                window.location.href = '/cart';
                return;
            }

            try {
                const response = await fetch('/api/cart-items', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        cartId: cartId,
                        itemId: itemId,
                        quantity: 1
                    })
                });

                const result = await response.json();

                if (!response.ok || !result.success) {
                    alert(result.message || 'Unable to add item to cart.');
                    return;
                }

                window.location.href = '/cart';
            } catch (error) {
                console.error(error);
                alert('Failed to add item to cart.');
            }
        });
    </script>
</body>
</html>
