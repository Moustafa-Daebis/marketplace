<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <title>Your Cart</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7ff, #eef7f4);
            color: #1f2937;
        }
        .nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #111827;
            color: white;
            padding: 16px 24px;
            border-radius: 0;
            margin: 0;
            box-shadow: 0 4px 14px rgba(17,24,39,0.12);
            z-index: 1000;
        }
        .brand { font-size: 1.5rem; font-weight: bold; }
        .menu-toggle { display: none; background: transparent; border: none; color: white; font-size: 1.25rem; cursor: pointer; }
        .nav-links { display: flex; gap: 16px; align-items: center; }
        .nav-links a { color: white; text-decoration: none; padding: 8px 12px; border-radius: 8px; }
        .nav-links a:hover { background: rgba(255,255,255,0.1); }
        .user-pill {
            color: white;
            font-weight: 600;
            padding: 8px 10px;
            border-radius: 999px;
            background: rgba(255,255,255,0.08);
        }
        .logout-btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            border-radius: 999px;
            padding: 8px 12px;
            font-weight: 600;
            cursor: pointer;
        }

        @media (max-width: 700px) {
            .menu-toggle { display: block; }
            .nav { padding: 12px 16px; }
            .nav-links { display: none; width: 100%; }
            .nav.open .nav-links { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
            .nav.open .nav-links a { display: block; padding: 10px 14px; }
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
            padding-top: 100px;
        }
        .card {
            background: white;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(17, 24, 39, 0.08);
        }
        h1 {
            margin-top: 0;
        }
        .cart-list {
            display: grid;
            gap: 16px;
            margin-top: 24px;
        }
        .cart-item {
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 18px;
            background: #fafafa;
        }
        .item-name {
            font-size: 1.2rem;
            font-weight: 700;
            margin: 0 0 8px;
        }
        .item-description {
            color: #4b5563;
            margin: 0 0 10px;
        }
        .item-meta {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            color: #374151;
        }
        .empty {
            color: #6b7280;
            font-size: 1rem;
        }
    </style>
</head>
<body>
    <nav class="nav" id="mainNav">
        <div class="brand">Marketplace</div>
        <button class="menu-toggle" aria-label="Toggle menu" onclick="document.getElementById('mainNav').classList.toggle('open')">☰</button>
        <div class="nav-links">
            <a th:href="@{/}">Home</a>
            <a th:href="@{/items}">Items</a>
            <a th:href="@{/add-item}">Sell</a>
            <a th:href="@{/cart}">Cart</a>

            <div class="profile-menu-container">
                <button class="profile-button" type="button" aria-label="Profile menu">
                    <span class="icon">👤</span>
                    <span th:text="${loggedIn ? user.firstName : 'Profile'}">Profile</span>
                </button>
                <div class="profile-menu" role="menu">
                    <a th:href="@{/profile}" class="placeholder" role="menuitem">My Profile</a>
                    <a href="#" class="placeholder" role="menuitem">Saved Items</a>
                    <a href="#" class="placeholder" role="menuitem">Orders</a>
                    <a href="#" class="placeholder" role="menuitem">Settings</a>

                    <div class="divider"></div>
                    <th:block th:if="${loggedIn}">
                        <form th:action="@{/logout}" method="post" style="margin:0;">
                            <button class="logout-btn" type="submit">Logout</button>
                        </form>
                    </th:block>
                    <th:block th:unless="${loggedIn}">
                        <a th:href="@{/login}" class="logout-btn" style="display:block; text-decoration:none; text-align:left;">Login</a>
                    </th:block>
                </div>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <h1>Your Cart</h1>

            <div th:if="${#lists.isEmpty(cartItems)}" class="empty">
                Your cart is empty.
            </div>

            <div th:unless="${#lists.isEmpty(cartItems)}" class="cart-list">
                <div th:each="item : ${cartItems}" class="cart-item">
                    <h2 class="item-name" th:text="${item.itemName}">Item name</h2>
                    <p class="item-description" th:text="${item.itemDescription}">Description</p>

                    <div class="item-meta">
                        <span><strong>Quantity:</strong> <span th:text="${item.quantity}">1</span></span>
                        <span><strong>Price:</strong> <span th:text="${item.price}">0.00</span></span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
