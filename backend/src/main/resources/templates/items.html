<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <title>Items</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7ff, #eef7f4);
            color: #1f2937;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 20px;
            padding-top: 100px;
        }
        .hero {
            display: grid;
            grid-template-columns: 1.3fr 1fr;
            gap: 30px;
            align-items: center;
        }
        .hero-card {
            background: white;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(17, 24, 39, 0.08);
            padding: 30px;
        }
        .hero-card h1 {
            font-size: 2.5rem;
            margin-bottom: 16px;
        }
        .hero-card p {
            font-size: 1.05rem;
            line-height: 1.7;
            color: #4b5563;
            margin-bottom: 24px;
        }
        .btn-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-block;
            text-decoration: none;
            padding: 12px 18px;
            border-radius: 10px;
            font-weight: 600;
            border: none;
            cursor: pointer;
        }
        .btn-primary {
            background: #2563eb;
            color: white;
        }
        .btn-secondary {
            background: #e5e7eb;
            color: #111827;
        }
        .auth-card {
            background: white;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(17, 24, 39, 0.08);
            padding: 24px;
        }
        .tab-buttons {
            display: flex;
            margin-bottom: 20px;
            border-radius: 10px;
            background: #f3f4f6;
            overflow: hidden;
        }
        .tab-buttons button {
            flex: 1;
            border: none;
            background: transparent;
            padding: 12px 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .tab-buttons .active {
            background: #111827;
            color: white;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 1rem;
        }
        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #4b5563;
        }
        .checkbox-row input {
            width: auto;
        }
        .features {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 40px;
        }
        .feature {
            background: white;
            border-radius: 16px;
            padding: 22px;
            box-shadow: 0 8px 20px rgba(17, 24, 39, 0.06);
        }
        .feature h3 {
            margin-top: 0;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .item-card-link {
            display: block;
            text-decoration: none;
            color: inherit;
        }
        .item-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(17, 24, 39, 0.06);
            padding: 20px;
            height: 100%;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .item-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 24px rgba(17, 24, 39, 0.1);
        }
        .item-card h3 {
            margin-top: 0;
            margin-bottom: 10px;
        }
        .item-card p {
            margin: 8px 0;
            color: #4b5563;
        }
        @media (max-width: 820px) {
            .hero, .features {
                grid-template-columns: 1fr;
            }
            .nav {
                flex-direction: column;
                gap: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <nav class="nav" id="mainNav">
            <div class="brand">Marketplace</div>
            <button class="menu-toggle" aria-label="Toggle menu" onclick="document.getElementById('mainNav').classList.toggle('open')">☰</button>
            <div class="nav-links">
                <a th:href="@{/}">Home</a>
                <a th:href="@{/items}">Items</a>
                <a th:href="@{/add-item}">Sell</a>
                <a th:href="@{/cart}">Cart</a>

                <div class="profile-menu-container">
                    <button class="profile-button" type="button" aria-label="Profile menu">
                        <span class="icon">👤</span>
                        <span th:text="${loggedIn ? user.firstName : 'Profile'}">Profile</span>
                    </button>
                    <div class="profile-menu" role="menu">
                        <a th:href="@{/profile}" class="placeholder" role="menuitem">My Profile</a>
                        <a href="#" class="placeholder" role="menuitem">Saved Items</a>
                        <a href="#" class="placeholder" role="menuitem">Orders</a>
                        <a href="#" class="placeholder" role="menuitem">Settings</a>

                        <div class="divider"></div>
                        <th:block th:if="${loggedIn}">
                            <form th:action="@{/logout}" method="post" style="margin:0;">
                                <button class="logout-btn" type="submit">Logout</button>
                            </form>
                        </th:block>
                        <th:block th:unless="${loggedIn}">
                            <a th:href="@{/login}" class="logout-btn" style="display:block; text-decoration:none; text-align:left;">Login</a>
                        </th:block>
                    </div>
                </div>
            </div>
        </nav>

            <div id="items-container" class="grid">
                <div th:if="${#lists.isEmpty(items)}">
                    No items available.
                </div>

                <a th:each="item : ${items}" th:href="@{/items/{id}(id=${item.id})}" class="item-card-link">
                    <div class="item-card">
                        <h3 th:text="${item.name}">Item title</h3>
                        <p th:text="${item.description}">Description</p>
                        <p>
                            <strong>Price:</strong>
                            <span th:text="${item.price}">0.00</span>
                        </p>
                        <p th:if="${item.sellerId != null}">
                            <strong>Seller:</strong>
                            <span th:text="${item.sellerId}">Seller</span>
                        </p>
                    </div>
                </a>
            </div>
        </div>

</body>
</html>
