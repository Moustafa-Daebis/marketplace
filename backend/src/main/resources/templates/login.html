<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #ecfeff);
            color: #111827;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .auth-box {
            background: white;
            border-radius: 18px;
            box-shadow: 0 12px 35px rgba(17, 24, 39, 0.08);
            width: 100%;
            max-width: 420px;
            padding: 32px 28px;
        }
        h1 {
            margin-top: 0;
            margin-bottom: 8px;
            text-align: center;
        }
        p {
            text-align: center;
            color: #6b7280;
            margin-bottom: 24px;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 1rem;
        }
        .btn {
            border: none;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 1rem;
            font-weight: 700;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }
        .row{
            display: flex;
            gap: 12px;
        }
        .link-row {
            text-align: center;
            margin-top: 18px;
            color: #4b5563;
        }
        .link-row a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="auth-box">
        <h1>Login</h1>
        <p>Welcome back to Marketplace</p>

        <form>
            <div class="row">
                <input type="email" placeholder="Email address" />
            </div>
            <div class="row">
                <input type="password" placeholder="Password" />
            </div>

            <button class="btn" type="submit">Sign In</button>
        </form>

        <div class="link-row">
            <span>Don’t have an account?</span>
            <a href="/register">Register</a>
        </div>
    </div>
</body>
</html>
