<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Item</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #ecfeff);
            color: #111827;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .auth-box {
            background: white;
            border-radius: 18px;
            box-shadow: 0 12px 35px rgba(17, 24, 39, 0.08);
            width: 100%;
            max-width: 640px;
            padding: 28px 28px;
        }
        h1 { margin-top: 0; margin-bottom: 6px; text-align: center; }
        p { text-align: center; color: #6b7280; margin-bottom: 18px; }
        form { display: flex; flex-direction: column; gap: 14px; }
        .row { display: flex; gap: 12px; }
        label { display:block; font-weight:600; margin-bottom:6px; }
        input[type=text], input[type=number], input[type=file], textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 1rem;
            box-sizing: border-box;
        }
        .btn {
            border: none;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 1rem;
            font-weight: 700;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }
        .actions { display:flex; align-items:center; gap:12px; }
        .link-row { text-align: center; margin-top: 12px; color: #4b5563; }
        .link-row a { color: #2563eb; text-decoration: none; font-weight: 600; }
        @media (max-width: 520px) { .row { flex-direction: column; } }
    </style>
</head>
<body>
    <div class="auth-box">
        <h1>Add Item</h1>
        <p>Create a new listing on Marketplace</p>

        <form th:action="@{/items}" method="post">


            <div>
                <label for="name">Title</label>
                <input type="text" id="name" name="name" placeholder="Item title" required />
            </div>

            <div>
                <label for="description">Description</label>
                <textarea id="description" name="description" rows="4" placeholder="Describe your item..."></textarea>
            </div>

            <div class="row">
                <div style="flex:1">
                    <label for="price">Price</label>
                    <input type="number" id="price" name="price" step="0.01" placeholder="0.00" required />
                </div>
                <div style="width:120px">
                    <label for="quantity">Qty</label>
                    <input type="number" id="quantity" name="quantity" min="0" value="1" />
                </div>
            </div>

            <div>
                <label for="image">Image (optional)</label>
                <input type="file" id="image" name="image" accept="image/*" />
            </div>

            <div class="actions">
                <button class="btn" type="submit">Add Item</button>
                <a th:href="@{/items}" style="color:#374151; font-weight:600; text-decoration:none;">Cancel</a>
            </div>
        </form>

        <div class="link-row">
            <span>Manage your items</span>
            <a th:href="@{/items}" style="margin-left:8px">View Items</a>
        </div>
    </div>
</body>
</html>
